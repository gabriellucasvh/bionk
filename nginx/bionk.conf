# =============================================================
# nginx/bionk.conf - Proxy reverso para o Next.js na VPS
# Domínio: bionk.duckdns.org (DuckDNS + Let's Encrypt)
#
# Copiar para: /etc/nginx/sites-available/bionk
# Ativar: ln -s /etc/nginx/sites-available/bionk /etc/nginx/sites-enabled/bionk
# Certificado: sudo certbot --nginx -d bionk.duckdns.org
# =============================================================

# Rate limiting global (proteção contra DDoS simples)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=60r/m;

# Upstream dinâmico do Next.js (Blue-Green Deployment)
upstream bionk_app {
    include /root/bionk/nginx/upstream.conf;
    keepalive 64;
}

# =====================================================
# HTTP → HTTPS redirect (obrigatório com Certbot)
# =====================================================
server {
    listen 80;
    server_name bionk.duckdns.org;

    # Certbot usará este bloco para verificação ACME
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =====================================================
# HTTPS - bloco principal (ativado após certbot)
# =====================================================
server {
    listen 443 ssl;
    server_name bionk.duckdns.org;

    # Certificados gerados pelo Certbot (preenchidos automaticamente)
    ssl_certificate     /etc/letsencrypt/live/bionk.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bionk.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Tamanho maximo de upload (para imagens/QR codes)
    client_max_body_size 10M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Buffers para Headers Gigantes do Next.js (evita 502 upstream sent too big header)
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    # Headers de seguranca
    add_header X-Frame-Options          "SAMEORIGIN"        always;
    add_header X-Content-Type-Options   "nosniff"           always;
    add_header X-XSS-Protection         "1; mode=block"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ocultar versao do Nginx
    server_tokens off;

    # =====================================================
    # Pagina de erro customizada (502 Bad Gateway)
    # =====================================================
    error_page 502 /502.html;
    location = /502.html {
        root /var/www/html;
        internal;
    }

    # =====================================================
    # Stripe Webhook - passa body RAW sem buffering
    # O Stripe verifica assinatura no body original
    # =====================================================
    location /api/stripe/webhook {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass         http://bionk_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # CRITICO: nao modificar o body do webhook
        proxy_request_buffering off;
    }

    # =====================================================
    # Rate limit para endpoints de autenticacao
    # =====================================================
    location ~ ^/api/(auth|onboarding) {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass         http://bionk_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # =====================================================
    # Rota principal - todas as requisicoes
    # =====================================================
    location / {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass         http://bionk_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache de arquivos estaticos do Next.js
    location /_next/static/ {
        proxy_pass         http://bionk_app;
        proxy_cache_valid  200 1y;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }
}
