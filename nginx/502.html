<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bionk - Atualizando...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1a1a1a;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 400px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e6e6e6;
            border-top: 4px solid #000000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 12px 0;
        }
        p {
            color: #767676;
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }
        .btn {
            display: inline-block;
            background-color: #000;
            color: #fff;
            padding: 10px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: opacity 0.2s;
            cursor: pointer;
            border: none;
        }
        .btn:hover {
            opacity: 0.8;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121216;
                color: #f7f7f8;
            }
            .spinner {
                border: 4px solid #3e3e4e;
                border-top: 4px solid #ffffff;
            }
            p {
                color: #8c8fa4;
            }
            .btn {
                background-color: #fff;
                color: #000;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Atualizando os motores...</h1>
        <p>O Bionk está recebendo uma nova atualização e reiniciando os servidores. Voltaremos ao ar em alguns segundos!</p>
        <button class="btn" onclick="window.location.reload()">Tentar novamente</button>
    </div>
    <script>
        // Tenta recarregar a página automaticamente a cada 5 segundos
        setInterval(() => {
            fetch(window.location.href, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        window.location.reload();
                    }
                })
                .catch(() => {});
        }, 5000);
    </script>
</body>
</html>
